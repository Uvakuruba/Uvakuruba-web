<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uvakuruba Experience</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }

    .content {
      max-width: 900px;
    }

    h1 {
      font-size: clamp(45px, 8vw, 90px);
      margin: 0;
      letter-spacing: 4px;
    }

    .experience {
      font-size: 18px;
      letter-spacing: 8px;
      margin-top: 10px;
      opacity: .7;
    }

    .phrase {
      margin-top: 70px;
      font-size: clamp(27px, 4vw, 48px);
      line-height: 1.25;
      font-weight: 300;
    }

    .phrase strong {
      display: block;
      margin-top: 8px;
    }

    .intro {
      margin: 45px auto 0;
      max-width: 650px;
      font-size: 18px;
      line-height: 1.7;
      opacity: .75;
    }

    .button {
      display: inline-block;
      margin-top: 40px;
      padding: 15px 30px;
      border: 1px solid white;
      border-radius: 40px;
      color: white;
      text-decoration: none;
      letter-spacing: 2px;
      transition: .3s;
    }

    .button:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

<section class="hero">
  <div class="content">

    <h1>UVAKURUBA</h1>
    <div class="experience">EXPERIENCE</div>

    <div class="phrase">
      Hay lugares que no se visitan...
      <strong>se quedan en ti.</strong>
    </div>

    <div class="intro">
      Viaja. Descubre. Conquista. Guarda aquello que merece ser recordado.
      Uvakuruba transforma tus experiencias en recuerdos que puedes volver
      a vivir.
    </div>

    <a class="button" href="#">
      INICIA TU EXPERIENCIA
    </a>

  </div>
</section>

</body>
</html>
